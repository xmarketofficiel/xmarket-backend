# GitHub Actions Workflow for Automatic EC2 Deployment
# This workflow automatically deploys to EC2 when you push to main branch

name: Deploy to EC2 Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Clean and install dependencies
      run: |
        rm -f package-lock.json
        npm install --legacy-peer-deps
        
    - name: Build application
      run: npm run build
        
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${ secrets.EC2_HOST }
        username: ${ secrets.EC2_USERNAME }
        key: ${ secrets.EC2_PRIVATE_KEY }
        timeout: 60s
        script: |
          cd /home/ubuntu/xmarket-project/backend
          
          # Fix git configuration and pull latest changes
          git fetch origin
          git reset --hard origin/main
          git config pull.rebase false
          git clean -fd
          
          # Install dependencies and build
          npm install --legacy-peer-deps
          npm run build
          
          # Restart application with PM2
          pm2 restart xmarket-backend || pm2 start dist/main.js --name xmarket-backend
          pm2 save
          
    - name: Verify deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        timeout: 30s
        script: |
          sleep 10
          curl -f http://localhost:3001/api || exit 1
          pm2 status xmarket-backend
